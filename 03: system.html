<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAI | Millennium Sovereign OS</title>
    <script src="https://cdn.tailwindcss.net"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Great+Vibes&family=Poppins:wght@200;600&display=swap');
        :root { --accent: #00f3ff; --bg: #00020a; --glass: rgba(255, 255, 255, 0.05); }
        body.light-mode { --bg: #f0f4f8; --accent: #0077ff; color: #1a202c; }
        body.royal-mode { --bg: #1a1a1a; --accent: #ffd700; color: #ffd700; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; transition: 0.5s; overflow-x: hidden; }
        .glass-panel { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--accent); border-radius: 30px; }
        .signature { font-family: 'Great Vibes', cursive; color: var(--accent); font-size: 32px; }
    </style>
</head>
<body class="pb-40" id="main-body">

    <div class="fixed top-20 left-4 z-[4000] flex flex-col gap-2">
        <button onclick="changeTheme('dark')" class="w-8 h-8 rounded-full bg-black border border-white"></button>
        <button onclick="changeTheme('light')" class="w-8 h-8 rounded-full bg-white border border-black"></button>
        <button onclick="changeTheme('royal')" class="w-8 h-8 rounded-full bg-yellow-500 border border-white"></button>
    </div>

    <header class="fixed top-0 w-full z-50 p-4 flex justify-between items-center bg-black/20 backdrop-blur-xl border-b border-white/10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white text-black flex items-center justify-center rounded-xl font-black text-xl">H</div>
            <div class="text-[8px] font-['Orbitron'] tracking-[2px]">
                <p class="text-cyan-400">HAI MILLENNIUM MASTER</p>
                <p class="opacity-50">H.S. CHAUHAN</p>
            </div>
        </div>
        <div class="flex gap-4 items-center">
             <i class="fas fa-search text-xl cursor-pointer text-cyan-500" onclick="voiceCommand()"></i>
             <i class="fas fa-fingerprint text-xl cursor-pointer" onclick="openAdmin()"></i>
        </div>
    </header>

    <main class="pt-32 px-6 max-w-lg mx-auto space-y-6">
        <div class="glass-panel p-8 text-center border-t-4 border-cyan-500">
            <h2 class="text-xs font-black tracking-widest mb-4 uppercase">System Control Unit</h2>
            <p class="text-sm italic">"Sovereign Millennium System: Active Level-10"</p>
        </div>

        <div class="glass-panel p-6">
            <p class="text-[10px] text-center mb-4 font-bold uppercase tracking-widest">Imperial Gateway</p>
            <button onclick="executePay()" class="w-full py-4 bg-cyan-500 text-black font-black rounded-2xl shadow-lg">INITIALIZE FIN-BRIDGE</button>
        </div>

        <div class="text-center py-10">
            <span class="signature">H.S. Chauhan</span>
        </div>
    </main>

    <script>
        function changeTheme(mode) {
            const body = document.getElementById('main-body');
            body.className = 'pb-40';
            if(mode === 'light') body.classList.add('light-mode');
            if(mode === 'royal') body.classList.add('royal-mode');
        }
        function voiceCommand() {
            let q = prompt("स्वामी जी, क्या खोजना है?");
            if(q) window.open(`https://www.google.com/search?q=${q}`, '_blank');
        }
        function openAdmin() {
            if(prompt("SECURITY KEY:") === "HARI_777") alert("ACCESS GRANTED, MASTER.");
            else alert("DENIED.");
        }
        function executePay() {
            window.location.href = `upi://pay?pa=harigovindsingh91-2@okhdfcbank&pn=H.S.Chauhan&cu=INR`;
        }
    </script>
</body>
</html>
