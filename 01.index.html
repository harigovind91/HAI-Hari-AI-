<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAI | 2026 Sovereign Gemini OS</title>
    <script src="https://cdn.tailwindcss.net"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@200;600&display=swap');
        :root { --accent: #00f3ff; --gold: #ffd700; --bg: #000814; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
        .super-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(40px); border: 1px solid rgba(0, 243, 255, 0.15); border-radius: 35px; transition: 0.4s; }
        .super-panel:hover { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0, 243, 255, 0.2); }
        .corporate-glow { border-color: var(--gold) !important; box-shadow: 0 0 25px rgba(255, 215, 0, 0.2); }
        .vertical-text { writing-mode: vertical-rl; text-orientation: mixed; }
    </style>
</head>
<body class="pb-40" onload="bootSystem()">

    <div onclick="toggleGlobalPay()" class="fixed right-0 top-1/4 z-[5000] bg-gradient-to-l from-yellow-600 to-yellow-400 p-4 rounded-l-3xl shadow-2xl cursor-pointer hover:pl-10 transition-all group">
        <div class="flex flex-col items-center gap-2 text-black font-black">
            <i class="fas fa-shuttle-van text-xl"></i>
            <span class="text-[8px] vertical-text tracking-widest uppercase">HAI GLOBAL PAY</span>
        </div>
    </div>

    <header class="fixed top-0 w-full z-50 p-6 flex justify-between items-center bg-black/60 backdrop-blur-3xl border-b border-white/5">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-white text-black flex items-center justify-center rounded-2xl font-black text-3xl shadow-[0_0_20px_white]">H</div>
            <div>
                <h1 class="text-xs font-['Orbitron'] tracking-[4px] text-cyan-400">HAI SUPER AI</h1>
                <p class="text-[8px] opacity-50 uppercase tracking-[2px]">Gemini 2026 Intelligent Edition</p>
            </div>
        </div>
        <div class="flex gap-5 text-2xl">
            <i class="fas fa-microchip text-cyan-500 cursor-pointer" onclick="scanHardware()" title="Hardware Scan"></i>
            <i class="fas fa-fingerprint text-gold cursor-pointer" onclick="openMasterVault()" title="Admin Panel"></i>
        </div>
    </header>

    <main class="pt-36 px-6 max-w-6xl mx-auto space-y-12">
        <div id="trial-banner" class="w-full py-2 bg-gradient-to-r from-cyan-900/50 to-transparent border-l-4 border-cyan-500 px-4 text-[10px] tracking-widest">
            30-DAY FREE TRIAL: ALL CHAT, NEWS, VIDEO & MEDIA ARE FREE.
        </div>

        <section class="super-panel p-8">
            <div class="flex flex-wrap gap-6 items-center">
                <div class="flex gap-4 border-r border-white/10 pr-6">
                    <label class="cursor-pointer text-cyan-400 hover:scale-110 transition"><i class="fas fa-paperclip text-2xl"></i><input type="file" class="hidden" onchange="uploadDoc(this)"></label>
                    <label class="cursor-pointer text-cyan-400 hover:scale-110 transition" onclick="startCamera()"><i class="fas fa-camera text-2xl"></i></label>
                </div>
                <input id="main-input" type="text" placeholder="HAI Gemini से कुछ भी कराएं..." class="flex-1 bg-transparent text-xl outline-none placeholder:opacity-20">
                <div class="flex gap-4 text-xl">
                    <i class="fas fa-phone-alt text-green-400 cursor-pointer" onclick="aiCall('Audio')"></i>
                    <i class="fas fa-video text-blue-400 cursor-pointer" onclick="aiCall('Video')"></i>
                </div>
            </div>
        </section>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div onclick="openPortal('Engineering')" class="super-panel p-8 text-center cursor-pointer">
                <i class="fas fa-drafting-pencil text-4xl mb-4 text-blue-400"></i>
                <p class="text-[10px] font-black tracking-widest uppercase">Engineering</p>
            </div>
            <div onclick="openPortal('Commerce')" class="super-panel p-8 text-center cursor-pointer">
                <i class="fas fa-globe text-4xl mb-4 text-green-400"></i>
                <p class="text-[10px] font-black tracking-widest uppercase">Commerce</p>
            </div>
            <div onclick="openPortal('Media')" class="super-panel p-8 text-center cursor-pointer">
                <i class="fas fa-play-circle text-4xl mb-4 text-red-400"></i>
                <p class="text-[10px] font-black tracking-widest uppercase">Reel Maker</p>
            </div>
            <div onclick="openPortal('Corporate')" class="super-panel p-8 text-center cursor-pointer corporate-glow border-2 border-yellow-500/30">
                <i class="fas fa-handshake text-4xl mb-4 text-yellow-500"></i>
                <p class="text-[10px] font-black tracking-widest text-yellow-500 uppercase">Tie-up Node</p>
            </div>
        </div>
    </main>

    <div id="portal-screen" class="fixed inset-0 bg-[#00050a] z-[10000] hidden overflow-y-auto p-10">
        <div class="flex justify-between items-center mb-10 border-b border-white/10 pb-6">
            <h2 id="portal-title" class="font-['Orbitron'] text-2xl text-cyan-400">HAI UNIVERSAL PORTAL</h2>
            <i class="fas fa-times-circle text-4xl text-red-500 cursor-pointer" onclick="closePortal()"></i>
        </div>
        <div id="portal-content" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
            </div>
    </div>

    <footer class="fixed bottom-10 w-full flex justify-center z-[5000]">
        <div id="mic-btn" onclick="startVoice()" class="w-24 h-24 bg-cyan-500 rounded-full flex items-center justify-center border-[12px] border-[#000814] shadow-[0_0_50px_rgba(0,243,255,0.4)] cursor-pointer">
            <i class="fas fa-microphone text-black text-4xl"></i>
        </div>
    </footer>

    <script>
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

        function bootSystem() {
            speak("Welcome. HAI Gemini Intelligent OS is live. 30-day free trial active.");
        }

        function speak(msg) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(msg);
            utter.lang = 'hi-IN';
            window.speechSynthesis.speak(utter);
        }

        function openPortal(sector) {
            document.getElementById('portal-screen').classList.remove('hidden');
            document.getElementById('portal-title').innerText = `HAI ${sector.toUpperCase()} HUB`;
            
            let content = '';
            if(sector === 'Corporate') {
                content = `
                    <div onclick="corporateSync('Google')" class="super-panel p-6 text-center border-b-4 border-blue-500 cursor-pointer">
                        <i class="fab fa-google text-2xl mb-2 text-blue-500"></i>
                        <p class="text-[9px] font-bold">GOOGLE TIE-UP</p>
                    </div>
                    <div onclick="corporateSync('Microsoft')" class="super-panel p-6 text-center border-b-4 border-cyan-400 cursor-pointer">
                        <i class="fab fa-windows text-2xl mb-2 text-cyan-400"></i>
                        <p class="text-[9px] font-bold">MICROSOFT SYNC</p>
                    </div>
                    <div onclick="corporateSync('Reliance')" class="super-panel p-6 text-center border-b-4 border-orange-500 cursor-pointer">
                        <i class="fas fa-industry text-2xl mb-2 text-orange-500"></i>
                        <p class="text-[9px] font-bold">RELIANCE/JIO</p>
                    </div>
                `;
            } else {
                for(let i=1; i<=12; i++) {
                    content += `
                        <div class="super-panel p-6 text-center hover:bg-cyan-500/10 cursor-pointer">
                            <i class="fas fa-tools text-xl mb-3 text-cyan-400"></i>
                            <p class="text-[9px] font-bold uppercase">${sector} TOOL ${i}</p>
                        </div>`;
                }
            }
            document.getElementById('portal-content').innerHTML = content;
            speak(`Opening ${sector} portal with advanced tools.`);
        }

        function closePortal() { document.getElementById('portal-screen').classList.add('hidden'); }

        function corporateSync(name) {
            speak(`${name} के साथ प्रपोजल और डेटा सिंक प्रक्रिया शुरू हो रही है।`);
            alert(`SOVEREIGN PROTOCOL: Syncing Official Nodes with ${name}...`);
        }

        function startVoice() {
            recognition.start();
            document.getElementById('mic-btn').classList.add('animate-pulse');
        }

        recognition.onresult = (e) => {
            const cmd = e.results[0][0].transcript;
            document.getElementById('mic-btn').classList.remove('animate-pulse');
            speak(`Analyzing Command: ${cmd}`);
            if(cmd.includes("इंजीनियरिंग")) openPortal('Engineering');
            else if(cmd.includes("कॉर्पोरेट")) openPortal('Corporate');
            else window.open(`https://www.google.com/search?q=${cmd}`, '_blank');
        };

        function scanHardware() {
            speak("Scanning hardware. Memory, CPU, and Battery status optimized for HAI.");
            alert("HARDWARE STATUS: \n- CPU: Sovereign Mode\n- RAM: HAI Optimized\n- Battery: Cloud Powered");
        }

        function uploadDoc() { speak("Document received. Gemini AI is analyzing the data."); }
        function startCamera() { speak("Vision sensor active. Analyzing surroundings."); }
        function aiCall(type) { speak(`Sovereign ${type} call initiated. Multi-language bridge active.`); }
        function toggleGlobalPay() { speak("Opening HAI Global Pay. Secure gateway active."); alert("HAI GLOBAL PAY: Secure Node HS-CHAUHAN-239"); }
        function openMasterVault() { if(prompt("MASTER KEY:") === "HARI_777") alert("Access Granted. Corporate Admin Dashboard Live."); }
    </script>
</body>
</html>
