<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HAI | Sovereign Master OS</title>
    <script src="https://cdn.tailwindcss.net"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@200;600&display=swap');
        
        :root { --accent: #00f3ff; --bg: #00020a; --glass: rgba(255, 255, 255, 0.03); }
        body.royal-mode { --accent: #ffd700; --bg: #0d0d0d; }
        body.light-mode { --accent: #0066ff; --bg: #f8fafc; color: #1e293b; }

        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; transition: 0.5s ease; overflow-x: hidden; touch-action: manipulation; }
        .glass-panel { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--accent); border-radius: 24px; transition: 0.3s; }
        .glass-panel:hover { border-color: #fff; box-shadow: 0 0 20px var(--accent); }
        .neon-glow { text-shadow: 0 0 15px var(--accent); color: var(--accent); }
        
        /* रिस्पॉन्सिव ग्रिड और लेआउट */
        .container-custom { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 1rem; }
        
        /* वॉयस पल्स */
        .mic-active { animation: pulse 1.5s infinite; background: #ff0055 !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); } 70% { box-shadow: 0 0 0 20px rgba(255, 0, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); } }

        /* मोबाइल ऑप्टिमाइजेशन */
        @media (max-width: 640px) {
            .glass-panel { padding: 1.5rem !important; border-radius: 20px; }
            .header-text { font-size: 8px !important; }
            footer { padding: 1.5rem !important; }
        }
    </style>
</head>
<body class="pb-32 sm:pb-40" id="main-body" onload="masterInitialization()">

    <header class="fixed top-0 w-full z-50 bg-black/60 backdrop-blur-3xl border-b border-white/10">
        <div class="container-custom py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 sm:w-12 sm:h-12 bg-white text-black flex items-center justify-center rounded-xl font-black text-xl sm:text-2xl shadow-lg">H</div>
                <div class="header-text font-['Orbitron'] tracking-[2px] sm:tracking-[3px] text-[10px] sm:text-[12px]">
                    <p class="neon-glow">HAI MILLENNIUM MASTER</p>
                    <p class="opacity-40" id="user-greeting">MASTER CORE ACTIVE</p>
                </div>
            </div>
            <div class="flex gap-4 sm:gap-6 items-center">
                <i class="fas fa-fingerprint text-2xl sm:text-3xl cursor-pointer text-cyan-400 hover:scale-110 transition" onclick="runFaceScan()"></i>
            </div>
        </div>
    </header>

    <div class="fixed top-24 left-4 z-[5000] flex flex-col gap-3 bg-black/50 p-2 rounded-2xl border border-white/10 backdrop-blur-lg">
        <div onclick="setTheme('dark')" class="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-cyan-900 border border-cyan-400 cursor-pointer"></div>
        <div onclick="setTheme('royal')" class="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-yellow-900 border border-yellow-400 cursor-pointer"></div>
        <div onclick="setTheme('light')" class="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-blue-100 border border-blue-600 cursor-pointer"></div>
    </div>

    <main class="container-custom pt-28 sm:pt-36 space-y-6 sm:space-y-10">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-10">
            <div class="glass-panel p-6 sm:p-10 text-center flex flex-col justify-center">
                <h2 class="text-[10px] font-black tracking-[5px] mb-6 opacity-50 uppercase">Temporal Alignment</h2>
                <input type="range" min="2026" max="3026" value="2026" id="year-slider" class="w-full accent-cyan-500 h-2 cursor-pointer">
                <p id="year-val" class="text-3xl sm:text-5xl font-black mt-4 font-['Orbitron'] neon-glow">2026</p>
                <p id="pred-text" class="text-xs sm:text-sm mt-6 italic opacity-70">"Avikary Cosy Science का स्वर्ण युग।"</p>
            </div>

            <div class="glass-panel p-6 sm:p-10 flex flex-col justify-center border-l-4 border-l-cyan-500">
                <p class="text-[9px] uppercase tracking-widest text-cyan-500 mb-4">Live System Intelligence</p>
                <p id="speech-text" class="text-sm sm:text-base text-gray-300 italic">"आदेश की प्रतीक्षा में..."</p>
                <div class="mt-6 flex items-center gap-3">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-ping"></div>
                    <span class="text-[8px] font-bold tracking-widest opacity-50 uppercase">Network: Secured Alpha-10</span>
                </div>
            </div>
        </div>

        <div class="glass-panel p-8 sm:p-12 border-t-4 border-cyan-500">
            <p class="text-[10px] font-black mb-6 uppercase tracking-widest text-center">Imperial Financial Bridge</p>
            <div class="max-w-md mx-auto">
                <input type="number" id="amt-input" placeholder="₹ Amount" class="w-full bg-black/40 border border-white/10 p-4 sm:p-5 rounded-3xl mb-6 text-center text-xl font-bold outline-none focus:border-cyan-400 text-white">
                <button onclick="executePay()" class="w-full py-4 sm:py-5 bg-cyan-500 text-black font-black rounded-3xl shadow-xl hover:brightness-110 active:scale-95 transition">EXECUTE TRANSFER</button>
            </div>
        </div>

    </main>

    <footer class="fixed bottom-0 w-full p-6 sm:p-10 flex justify-around items-center bg-black/90 backdrop-blur-2xl border-t border-white/10">
        <i class="fas fa-home text-xl sm:text-2xl opacity-20 hover:opacity-100 cursor-pointer transition" onclick="location.reload()"></i>
        
        <div onclick="startGlobalVoice()" id="voice-trigger" class="w-16 h-16 sm:w-24 sm:h-24 bg-cyan-500 rounded-full -mt-16 sm:-mt-24 flex items-center justify-center border-[6px] sm:border-[10px] border-[#00020a] shadow-2xl cursor-pointer hover:scale-110 active:scale-90 transition">
            <i class="fas fa-microphone text-black text-2xl sm:text-4xl"></i>
        </div>
        
        <i class="fas fa-shield-alt text-xl sm:text-2xl opacity-20 hover:opacity-100 cursor-pointer transition" onclick="alert('Security Policy Level-10-Alpha Active')"></i>
    </footer>

    <script>
        // मास्टर सेटिंग्स और वॉयस लॉजिक
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'hi-IN';

        function speak(msg) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(msg);
            utter.lang = 'hi-IN';
            window.speechSynthesis.speak(utter);
            document.getElementById('speech-text').innerText = msg;
        }

        function masterInitialization() {
            setTimeout(() => {
                speak("प्रणाम स्वामी जी। HAI सिस्टम सभी उपकरणों पर सक्रिय है। आपका नाम?");
                setTimeout(() => { startGlobalVoice(); }, 4000);
            }, 1000);
        }

        function startGlobalVoice() {
            try { recognition.start(); document.getElementById('voice-trigger').classList.add('mic-active'); }
            catch(e) { console.log("Mic already active"); }
        }

        recognition.onresult = (e) => {
            const cmd = e.results[0][0].transcript.toLowerCase();
            document.getElementById('voice-trigger').classList.remove('mic-active');
            processAction(cmd);
        };

        function processAction(cmd) {
            if(cmd.includes("नाम")) {
                let n = cmd.split("नाम")[1] || "यूजर";
                speak(`स्वागत है ${n}, मैं आपकी क्या सेवा करूँ?`);
            } else if(cmd.includes("खोजो")) {
                let q = cmd.replace("खोजो", "");
                speak(`${q} खोजा जा रहा है।`);
                window.open(`https://www.google.com/search?q=${q}`, '_blank');
            } else if(cmd.includes("पेमेंट")) {
                executePay();
            } else {
                speak("आदेश समझ नहीं आया, कृपया पुनः कहें।");
            }
        }

        function setTheme(m) {
            const b = document.body;
            b.className = "pb-32 sm:pb-40";
            if(m === 'royal') b.classList.add('royal-mode');
            if(m === 'light') b.classList.add('light-mode');
            speak(`${m} मोड सक्रिय किया गया।`);
        }

        function executePay() {
            const a = document.getElementById('amt-input').value || 1;
            speak(`${a} रुपये का भुगतान शुरू।`);
            window.location.href = `upi://pay?pa=harigovindsingh91-2@okhdfcbank&pn=H.S.Chauhan&am=${a}&cu=INR`;
        }

        const s = document.getElementById('year-slider');
        s.oninput = function() {
            document.getElementById('year-val').innerText = this.value;
            document.getElementById('pred-text').innerText = this.value > 2100 ? '"मानवता अब आपके अधीन है।"' : '"2026: स्वर्ण युग।"';
        };
    </script>
</body>
</html>
