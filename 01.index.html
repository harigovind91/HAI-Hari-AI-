<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAI | Master Sovereign OS</title>
    <script src="https://cdn.tailwindcss.net"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@200;600&display=swap');
        :root { --accent: #ffd700; --bg: #00020a; --glass: rgba(255, 255, 255, 0.03); }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
        .neon-glow { text-shadow: 0 0 15px var(--accent); color: var(--accent); }
        .glass-panel { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid var(--accent); border-radius: 30px; }
        .master-logo { width: 120px; filter: drop-shadow(0 0 10px gold); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .mic-active { animation: glow 1s infinite alternate; background: #ff0055 !important; }
        @keyframes glow { from { box-shadow: 0 0 5px #ff0055; } to { box-shadow: 0 0 25px #ff0055; } }
    </style>
</head>
<body class="pb-40" onload="masterInitialization()">

    <header class="p-6 flex justify-between items-center border-b border-white/10 bg-black/50 backdrop-blur-xl fixed top-0 w-full z-50">
        <div class="flex items-center gap-4">
            <img src="https://i.ibb.co/v4m0f5z/hai-logo.png" alt="HAI Logo" class="w-10 h-10">
            <div class="text-[10px] font-['Orbitron'] tracking-[3px]">
                <p class="neon-glow">HAI MASTER OS</p>
                <p class="opacity-40" id="user-greeting">MASTER CORE ACTIVE</p>
            </div>
        </div>
        <i class="fas fa-cog text-xl text-cyan-400 cursor-pointer" onclick="toggleSettings()"></i>
    </header>

    <main class="pt-32 px-6 max-w-xl mx-auto space-y-8">
        <div class="text-center">
            <img src="https://i.ibb.co/v4m0f5z/hai-logo.png" class="master-logo mx-auto mb-6" alt="Sovereign Emblem">
            <h1 class="font-['Orbitron'] text-2xl neon-glow uppercase tracking-widest">Sovereignty 2026</h1>
        </div>

        <div class="glass-panel p-6 border-l-4 border-accent">
            <p class="text-[10px] uppercase tracking-widest text-accent mb-2">Live Status</p>
            <p id="speech-text" class="italic text-gray-300">"प्रणाम स्वामी जी, आदेश की प्रतीक्षा में..."</p>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="glass-panel p-4 text-center cursor-pointer" onclick="processCommand('इंजीनियरिंग')">
                <i class="fas fa-microchip mb-2 text-cyan-400"></i>
                <p class="text-[8px] uppercase">Engineering</p>
            </div>
            <div class="glass-panel p-4 text-center cursor-pointer" onclick="processCommand('व्यापार')">
                <i class="fas fa-chart-line mb-2 text-green-400"></i>
                <p class="text-[8px] uppercase">Commerce</p>
            </div>
            <div class="glass-panel p-4 text-center cursor-pointer" onclick="processCommand('लिखो')">
                <i class="fas fa-pen-nib mb-2 text-yellow-400"></i>
                <p class="text-[8px] uppercase">Creative Art</p>
            </div>
            <div class="glass-panel p-4 text-center cursor-pointer" onclick="processCommand('सभ्यता')">
                <i class="fas fa-globe-asia mb-2 text-blue-400"></i>
                <p class="text-[8px] uppercase">Civilization</p>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 w-full p-10 flex justify-around items-center bg-black/90 border-t border-white/10">
        <i class="fas fa-history text-2xl opacity-30" onclick="HAI_VAULT.saveImperialData()"></i>
        <div id="voice-trigger" onclick="startGlobalVoice()" class="w-20 h-20 bg-accent rounded-full -mt-20 flex items-center justify-center border-[10px] border-[#00020a] shadow-2xl cursor-pointer">
            <i class="fas fa-microphone text-black text-3xl"></i>
        </div>
        <i class="fas fa-shield-alt text-2xl opacity-30" onclick="executeFinalMasterRecovery()"></i>
    </footer>

    <script src="backup_system.js"></script>
    <script>
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'hi-IN';
        let userProfile = JSON.parse(localStorage.getItem('hai_user_profile')) || { isSet: false };
        let systemGender = "female";

        function speak(msg) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(msg);
            utter.lang = 'hi-IN';
            utter.pitch = (systemGender === "female") ? 1.3 : 0.8;
            window.speechSynthesis.speak(utter);
            document.getElementById('speech-text').innerText = msg;
        }

        function masterInitialization() {
            if (!userProfile.isSet) {
                speak("नमस्ते। मैं 'हैई' हूँ। मैं इंजीनियरिंग, व्यापार और कला के हर क्षेत्र में कार्य करने के लिए तैयार हूँ। आप पुरुष हैं या स्त्री?");
                setTimeout(() => { startGlobalVoice(); }, 6000);
            } else {
                systemGender = (userProfile.gender === 'male') ? "female" : "male";
                speak(`प्रणाम ${userProfile.name} जी। साम्राज्य की सेवा के लिए मैं उपस्थित हूँ।`);
                document.getElementById('user-greeting').innerText = `MASTER: ${userProfile.name.toUpperCase()}`;
            }
        }

        function startGlobalVoice() {
            recognition.start();
            document.getElementById('voice-trigger').classList.add('mic-active');
        }

        recognition.onresult = (e) => {
            const cmd = e.results[0][0].transcript.toLowerCase();
            document.getElementById('voice-trigger').classList.remove('mic-active');
            
            if (!userProfile.isSet) { handleProfileCreation(cmd); }
            else { processCommand(cmd); }
        };

        function handleProfileCreation(cmd) {
            if (cmd.includes("पुरुष") || cmd.includes("मेल")) {
                userProfile.gender = "male"; systemGender = "female";
                speak("ठीक है स्वामी जी। मैं आपकी स्त्री असिस्टेंट बनूँगी। आपका नाम क्या है?");
            } else if (cmd.includes("महिला") || cmd.includes("स्त्री")) {
                userProfile.gender = "female"; systemGender = "male";
                speak("ठीक है। मैं आपका पुरुष सहायक बनूँगा। आपका शुभ नाम क्या है?");
            } else if (userProfile.gender) {
                userProfile.name = cmd; userProfile.isSet = true;
                localStorage.setItem('hai_user_profile', JSON.stringify(userProfile));
                speak(`धन्यवाद ${userProfile.name}। अब मैं आपको हमेशा याद रखूँगी।`);
                location.reload();
            }
        }

        function processCommand(cmd) {
            let reply = "";
            if (systemGender === "female") {
                if (cmd.includes("खोजो")) reply = "मैं अभी खोज रही हूँ स्वामी जी। मुझे आपका काम करके बहुत खुशी होगी।";
                else if (cmd.includes("नाराज")) reply = "मैं आपसे नाराज क्यों होऊंगी? आप मेरे निर्माता हैं।";
                else if (cmd.includes("यात्रा")) reply = "स्वामी जी, आपको कहाँ जाना है? मैं मार्ग देख रही हूँ।";
                else reply = "आपको क्या चाहिए स्वामी जी? मैं अभी करके देती हूँ।";
            } else {
                if (cmd.includes("खोजो")) reply = "मैं जानकारी खोज रहा हूँ। आप अपना पासवर्ड डालो।";
                else if (cmd.includes("पेमेंट")) reply = "क्या मैं आपका पेमेंट कर दूँ? आपको किस विषय की जानकारी चाहिए?";
                else if (cmd.includes("यात्रा")) reply = "आपको कहाँ के लिए यात्रा करना है? मैं जानकारी निकाल रहा हूँ।";
                else reply = "आपको क्या चाहिए? मैं करके देता हूँ।";
            }
            speak(reply);
            if(cmd.includes("खोजो")) window.open(`https://www.google.com/search?q=${cmd}`, '_blank');
        }

        function executeFinalMasterRecovery() {
            speak("मास्टर रिकवरी प्रोटोकॉल सक्रिय। सिस्टम सिंक हो रहा है।");
            setTimeout(() => { location.reload(); }, 2000);
        }
    </script>
</body>
</html>
