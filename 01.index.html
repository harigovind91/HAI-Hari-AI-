<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAI | 2026 Gemini Super-AI OS</title>
    <script src="https://cdn.tailwindcss.net"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@200;600&display=swap');
        :root { --accent: #00f3ff; --gold: #ffd700; --bg: #000814; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: #fff; overflow-x: hidden; }
        .super-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(40px); border: 1px solid rgba(0, 243, 255, 0.15); border-radius: 35px; }
        .gemini-glow { box-shadow: 0 0 30px rgba(0, 243, 255, 0.3); border-color: var(--accent); }
    </style>
</head>
<body class="pb-40" onload="bootGeminiHAI()">

    <header class="fixed top-0 w-full z-50 p-6 flex justify-between items-center bg-black/60 backdrop-blur-3xl border-b border-white/5">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-gradient-to-br from-cyan-400 to-blue-600 text-white flex items-center justify-center rounded-2xl font-black text-3xl shadow-lg">H</div>
            <div>
                <h1 class="text-xs font-['Orbitron'] tracking-[4px] text-cyan-400">HAI WORLD ENGINE</h1>
                <p class="text-[8px] opacity-50 uppercase">2026 Gemini Intelligent System</p>
            </div>
        </div>
        <div class="flex gap-5 text-2xl">
            <i class="fas fa-desktop text-cyan-500 cursor-pointer" onclick="toggleSuperPortal()" title="Super Screen"></i>
            <i class="fas fa-fingerprint text-gold cursor-pointer" onclick="openMasterVault()"></i>
        </div>
    </header>

    <main class="pt-36 px-6 max-w-6xl mx-auto space-y-12">
        <section class="super-panel p-10 text-center gemini-glow">
            <div id="trial-timer" class="text-[9px] text-yellow-500 mb-4 tracking-widest">FREE TRIAL: 30 DAYS REMAINING</div>
            <h2 id="ai-status" class="text-2xl font-light">Gemini AI Nodes: Connected</h2>
            <div class="flex justify-center gap-4 mt-6">
                <button onclick="aiCall('Audio')" class="p-4 rounded-full bg-white/5 border border-white/10 hover:border-green-400"><i class="fas fa-phone-alt text-green-400"></i></button>
                <button onclick="aiCall('Video')" class="p-4 rounded-full bg-white/5 border border-white/10 hover:border-blue-400"><i class="fas fa-video text-blue-400"></i></button>
                <button onclick="startCamera()" class="p-4 rounded-full bg-white/5 border border-white/10 hover:border-red-400"><i class="fas fa-camera text-red-400"></i></button>
            </div>
        </section>

        <section class="super-panel p-6 flex items-center gap-4">
            <label class="cursor-pointer text-cyan-400"><i class="fas fa-upload text-xl"></i><input type="file" class="hidden" onchange="uploadDoc(this)"></label>
            <input id="user-cmd" type="text" placeholder="HAI Gemini से कुछ भी पूछें या काम कराएं..." class="flex-1 bg-transparent border-none outline-none text-xl placeholder:opacity-20">
            <i class="fas fa-microphone-alt text-3xl text-cyan-500 cursor-pointer" onclick="startVoice()"></i>
        </section>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <div onclick="openSector('Engineering')" class="super-panel p-8 text-center cursor-pointer hover:bg-white/5 transition">
                <i class="fas fa-drafting-pencil text-3xl mb-3 text-blue-400"></i>
                <p class="text-[10px] font-bold">ENGINEERING</p>
            </div>
            <div onclick="openSector('Commerce')" class="super-panel p-8 text-center cursor-pointer hover:bg-white/5 transition">
                <i class="fas fa-globe-americas text-3xl mb-3 text-green-400"></i>
                <p class="text-[10px] font-bold">COMMERCE</p>
            </div>
            <div onclick="openSector('Media')" class="super-panel p-8 text-center cursor-pointer hover:bg-white/5 transition">
                <i class="fas fa-clapperboard text-3xl mb-3 text-red-400"></i>
                <p class="text-[10px] font-bold">REEL/VIDEO</p>
            </div>
            <div onclick="openSector('GlobalPay')" class="super-panel p-8 text-center cursor-pointer hover:bg-white/5 transition border border-yellow-500/30">
                <i class="fas fa-shuttle-van text-3xl mb-3 text-yellow-500"></i>
                <p class="text-[10px] font-bold text-yellow-500">GLOBAL PAY</p>
            </div>
        </div>
    </main>

    <div id="portal" class="fixed inset-0 bg-[#00050a] z-[10000] hidden p-10 overflow-y-auto">
        <div class="flex justify-between items-center mb-10 border-b border-white/10 pb-6">
            <h2 id="portal-title" class="font-['Orbitron'] text-2xl text-cyan-400">HAI UNIVERSAL PORTAL</h2>
            <i class="fas fa-times-circle text-4xl text-red-500 cursor-pointer" onclick="toggleSuperPortal()"></i>
        </div>
        <div id="portal-content" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6">
            </div>
    </div>

    <script>
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        
        function bootGeminiHAI() {
            speak("Welcome. HAI Super Intelligence link with Gemini is active. All systems 2026 optimized.");
        }

        function speak(msg) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(msg);
            utter.lang = 'hi-IN';
            window.speechSynthesis.speak(utter);
            document.getElementById('ai-status').innerText = msg;
        }

        function toggleSuperPortal() {
            document.getElementById('portal').classList.toggle('hidden');
        }

        function openSector(name) {
            toggleSuperPortal();
            document.getElementById('portal-title').innerText = `HAI ${name.toUpperCase()} HUB`;
            let tools = '';
            for(let i=1; i<=12; i++) {
                tools += `<div class="super-panel p-6 text-center hover:bg-cyan-500/10 cursor-pointer">
                    <i class="fas fa-tools text-xl mb-3 text-cyan-400"></i>
                    <p class="text-[9px] font-bold uppercase">${name} Tool ${i}</p>
                </div>`;
            }
            document.getElementById('portal-content').innerHTML = tools;
            speak(`Opening ${name} super screen with advanced tools.`);
        }

        function startVoice() {
            recognition.start();
            speak("Listening...");
        }

        recognition.onresult = (e) => {
            const cmd = e.results[0][0].transcript;
            speak(`Analyzing: ${cmd}`);
            // Gemini API Integration Logic will go here
        }

        function uploadDoc(input) { speak("दस्तावेज़ प्राप्त हुआ। HAI Gemini इसका विश्लेषण कर रही है।"); }
        function startCamera() { speak("कैमरा स्कैन मोड सक्रिय।"); }
        function aiCall(type) { speak(`Sovereign ${type} Call चालू है। लाइव अनुवाद सक्रिय।`); }
        function openMasterVault() { if(prompt("MASTER KEY:") === "HARI_777") alert("Access Granted."); }
    </script>
</body>
                                                                                                 </html>
